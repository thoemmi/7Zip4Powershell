name: Release and Publish

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]      # Trigger on version tags
  workflow_dispatch:    # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for GitVersion
    
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
    
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      with:
        versionSpec: '6.2.x'
    
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      with:
        configFilePath: GitVersion.yml
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Prepare Module
      shell: pwsh
      env:
        MODULE_PRERELEASE: ${{ steps.gitversion.outputs.preReleaseTag }}
      run: |
        # Create module folder
        $moduleTargetPath = Join-Path $env:GITHUB_WORKSPACE "Module" "7Zip4Powershell"
        New-Item $moduleTargetPath -ItemType Directory -Force
        
        # Copy files
        Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "7Zip4Powershell" "bin" "Release" "netstandard2.0" "*.*") -Exclude "JetBrains.Annotations.dll" -Destination $moduleTargetPath
        
        # Update version in PSD1
        $psd1File = Join-Path $moduleTargetPath "7Zip4PowerShell.psd1"
        $version = "${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}.${{ steps.gitversion.outputs.patch }}"
        # PowerShell Gallery requires a SemVer 1 suffix (e.g. beta1, not beta.1).
        $prerelease = $env:MODULE_PRERELEASE -replace '\.', ''
        (((Get-Content $psd1File -Raw) -replace '\$version\$',$version) -replace '\$prerelease\$',$prerelease) | Set-Content $psd1File
        Test-ModuleManifest -Path $psd1File -ErrorAction Stop | Out-Null

    - name: Upload Module Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: module
        path: Module/7Zip4Powershell

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Download Module Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: module
        path: Module/7Zip4Powershell

    - name: Generate Release Notes
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $notes = gh api repos/${{ github.repository }}/releases/generate-notes `
          -f tag_name=${{ github.ref_name }} `
          --jq '.body'
        if ([string]::IsNullOrWhiteSpace($notes)) { throw "Release notes generation returned empty content" }
        $notes | Out-File -FilePath "release-notes.md" -Encoding utf8
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Add Release Notes to Module Manifest
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $releaseNotes = Get-Content -Path "release-notes.md" -Raw -ErrorAction Stop
        if ([string]::IsNullOrWhiteSpace($releaseNotes)) { throw "Release notes file 'release-notes.md' is empty or whitespace-only" }

        $psd1File = Join-Path $env:GITHUB_WORKSPACE "Module" "7Zip4Powershell" "7Zip4Powershell.psd1"
        $manifest = Get-Content -Path $psd1File -Raw -ErrorAction Stop
        $releaseNotesPlaceholder = "        # ReleaseNotes = ''"
        $escapedReleaseNotes = $releaseNotes.Replace("'", "''")
        $releaseNotesEntry = "        ReleaseNotes = '$escapedReleaseNotes'"
        $updatedManifest = $manifest.Replace($releaseNotesPlaceholder, $releaseNotesEntry)
        if ($updatedManifest -eq $manifest) { throw "ReleaseNotes placeholder not found in '$psd1File'" }

        $updatedManifest | Set-Content -Path $psd1File
        Test-ModuleManifest -Path $psd1File | Out-Null

    - name: Publish to PowerShell Gallery
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $releaseNotes = Get-Content -Path "release-notes.md" -Raw -ErrorAction Stop
        if ([string]::IsNullOrWhiteSpace($releaseNotes)) { throw "Release notes file 'release-notes.md' is empty or whitespace-only" }
        Publish-Module -Path (Join-Path $env:GITHUB_WORKSPACE "Module" "7Zip4Powershell") -NuGetApiKey $env:NUGET_API_KEY -ReleaseNotes $releaseNotes
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        body_path: release-notes.md
