name: Update 7-Zip DLLs

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read

concurrency:
  group: update-7zip-libraries
  cancel-in-progress: false

jobs:
  check-and-update:
    # Only trusted default-branch code may use the updater App credentials.
    if: github.repository == 'thoemmi/7Zip4Powershell' && github.ref == 'refs/heads/master'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for 7-Zip updates
        id: check
        shell: pwsh
        run: |
          .\Scripts\Update-7ZipDlls.ps1 -CheckOnly -Verbose

      - name: Download and extract updated DLLs
        if: steps.check.outputs.update_available == 'true'
        shell: pwsh
        env:
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        run: |
          .\Scripts\Update-7ZipDlls.ps1 -Update -TargetVersion $env:NEW_VERSION -Verbose

      - name: Create updater App token
        if: steps.check.outputs.update_available == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.SEVENZIP_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEVENZIP_UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update Pull Request
        if: steps.check.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # App-created PRs trigger PR Build without manual workflow approval.
          token: ${{ steps.app-token.outputs.token }}
          base: master
          add-paths: |
            Libs/7z.dll
            Libs/7z64.dll
            Libs/7zARM64.dll
            Libs/License.txt
            Libs/7zip-version.json
          commit-message: "Update 7-Zip libraries to ${{ steps.check.outputs.new_version }}"
          title: "Update 7-Zip libraries to ${{ steps.check.outputs.new_version }}"
          assignees: thoemmi
          body: |
            Automated update of 7-Zip native DLLs to version ${{ steps.check.outputs.new_version }}.

            ## Changes
            - Updated `7z.dll` (x86)
            - Updated `7z64.dll` (x64)
            - Updated `7zARM64.dll` (ARM64)
            - Updated `License.txt` (copied from installer)
            - Updated version tracking metadata (`Libs/7zip-version.json`)

            ## Source
            Downloaded from official 7-zip.org website:
            - [Download page](https://www.7-zip.org/download.html)
            - [7-Zip on SourceForge](https://sourceforge.net/projects/sevenzip/)

            ## Automated Verification
            The PR Build workflow automatically builds the module in Release configuration and runs the Pester compression/extraction tests.
            Review its result before merging this update.

            ## DLL Checksums
            The SHA256 checksums are documented in `Libs/7zip-version.json` for verification.
          # Reuse the open PR when a newer version becomes available.
          branch: update-7zip-libraries
          delete-branch: true
          labels: |
            dependencies
            automated
          draft: false
